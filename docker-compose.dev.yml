# Local infrastructure for development, tests and the demo. Not for production (see docker-compose.yml).
name: mintree-dev
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: mintree, POSTGRES_PASSWORD: mintree, POSTGRES_DB: mintree }
    ports: ["5433:5432"]
    volumes: ["devpg:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U mintree"], interval: 3s, timeout: 3s, retries: 30 }
  redis:
    image: redis:7
    ports: ["6379:6379"]
  rabbitmq:
    image: rabbitmq:3.12-management
    environment: { RABBITMQ_DEFAULT_USER: guest, RABBITMQ_DEFAULT_PASS: guest }
    ports: ["5672:5672", "15672:15672"]
volumes: { devpg: {} }
