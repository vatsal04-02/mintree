# Single-host production-style deployment. NOT exercised in the development sandbox (no Docker daemon there): validate with `docker compose config`
# and a staging run before relying on it. Copy .env.example to .env and replace every CHANGE_ME first.
name: mintree
x-backend: &backend
  build: ./backend
  restart: unless-stopped
  env_file: .env
  environment: &backend-env
    MINTREE_DATABASE_URL: postgresql+psycopg://mintree:${POSTGRES_PASSWORD}@db:5432/mintree
    MINTREE_REDIS_URL: redis://redis:6379/0
    MINTREE_BROKER_URL: amqp://mintree:${RABBITMQ_PASSWORD}@rabbitmq:5672//
    MINTREE_ENVIRONMENT: production
    MINTREE_COOKIE_SECURE: "true"
    MINTREE_RATE_LIMIT_ENABLED: "true"
    MINTREE_TRUST_FORWARDED_FOR: "true"
  depends_on: { db: { condition: service_healthy }, redis: { condition: service_started }, rabbitmq: { condition: service_healthy } }
  volumes: [ "documents:/srv/storage" ]

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment: { POSTGRES_USER: mintree, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: mintree }
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U mintree -d mintree"], interval: 5s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]      # cache and coordination only; never authoritative
  rabbitmq:
    image: rabbitmq:3.12-management
    restart: unless-stopped
    environment: { RABBITMQ_DEFAULT_USER: mintree, RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD}" }
    volumes: [ "rabbitdata:/var/lib/rabbitmq" ]
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, timeout: 5s, retries: 20 }
  migrate:
    <<: *backend
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
  api:
    <<: *backend
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck: { test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).status == 200 else 1)"], interval: 15s, timeout: 5s, retries: 5 }
  worker:
    <<: *backend
    depends_on: { migrate: { condition: service_completed_successfully } }
    command: ["celery", "-A", "app.workers.celery_app", "worker", "-Q", "default,notifications", "-c", "4", "-l", "warning"]
  beat:
    <<: *backend
    depends_on: { migrate: { condition: service_completed_successfully } }
    command: ["celery", "-A", "app.workers.celery_app", "beat", "-l", "warning", "--schedule", "/tmp/celerybeat-schedule"]
  publisher:
    <<: *backend
    depends_on: { migrate: { condition: service_completed_successfully } }
    command: ["python", "-m", "app.workers.outbox_publisher"]
  web:
    build: { context: ./frontend, args: { BACKEND_URL: "http://api:8000" } }
    restart: unless-stopped
    depends_on: [ api ]
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: .env
    ports: [ "80:80", "443:443" ]
    volumes: [ "./ops/Caddyfile:/etc/caddy/Caddyfile:ro", "caddydata:/data" ]
    depends_on: [ web, api ]

volumes: { pgdata: {}, rabbitdata: {}, documents: {}, caddydata: {} }
